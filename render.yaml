services:
  - type: web
    name: bookloop-backend
    env: python
    region: oregon
    plan: free
    root_dir: backend
    build:
      command: pip install -r requirements.txt
    start:
      command: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
