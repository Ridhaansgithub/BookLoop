services:
  - type: web
    name: bookloop-backend
    env: python
    region: oregon
    plan: free
    root_dir: backend
    build:
      command: pip install -r requirements.txt
    start:
      command: gunicorn -w 2 -b 0.0.0.0:$PORT main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
